name: Deploy Quartz site to GitHub Pages
on:
  push:
    branches:
      - v4
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        shell: bash

      - name: Build site (use repository `content` folder)
        # explicitly build from the `content` folder so CI uses your content
        run: npx quartz build -d content
        shell: bash

      - name: "Debug: list build output (public)"
        run: |
          echo "Listing public directory:"
          if [ -d public ]; then
            ls -la public
          else
            echo "public directory NOT found"
          fi

          echo "Count files:"
          if [ -d public ]; then
            find public -type f | wc -l
          else
            echo "0"
          fi

          echo "Show head of public/index.html (if exists):"
          if [ -f public/index.html ]; then
            sed -n '1,60p' public/index.html
          else
            echo "public/index.html missing"
          fi
        shell: bash

      - name: Prepare publish (disable Jekyll + add base href)
        run: |
          # disable Jekyll
          touch public/.nojekyll

          # insert base href if needed (adjust REPO_PATH if you host under different path)
          REPO_PATH="/NANOlabs/"
          find public -name '*.html' -print0 | while IFS= read -r -d '' f; do
            if ! grep -qi "<base " "$f"; then
              perl -0777 -pe 's|<head>|<head>\n  <base href="'"${REPO_PATH}"'">|' -i "$f"
            fi
          done
        shell: bash

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages