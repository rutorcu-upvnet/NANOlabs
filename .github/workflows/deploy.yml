name: Deploy Quartz site to GitHub Pages
on:
  push:
    branches:
      - v4
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Debug: list build output
        run: |
          echo "Listing docs directory:"
          ls -la docs || true
          echo "Count files:"
          find docs -type f | wc -l || true
          echo "Show head of docs/index.html (if exists):"
          if [ -f docs/index.html ]; then sed -n '1,60p' docs/index.html; else echo "docs/index.html missing"; fi

      - name: Prepare publish
        run: |
          # disable Jekyll
          touch docs/.nojekyll
          # insert base href if needed
          REPO_PATH="/NANOlabs/"
          find docs -name '*.html' -print0 | while IFS= read -r -d '' f; do
            if ! grep -qi "<base " "$f"; then
              perl -0777 -pe 's|<head>|<head>\n  <base href="'"${REPO_PATH}"'">|' -i "$f"
            fi
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
